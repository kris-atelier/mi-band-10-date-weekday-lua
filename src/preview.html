<!doctype html>
<meta charset="utf-8">
<title>Mi Band 10 Date Weekday Lua</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #202020; }
  .band { width: 520px; height: 212px; display: grid; place-items: center; background: #000; border-radius: 28px; color: #fff; font-family: Helvetica, "Helvetica Neue", Arial, sans-serif; font-weight: 700; text-align: center; }
  .date-view { display: grid; align-content: center; justify-items: center; gap: 12px; width: 100%; }
  .date { font-size: 48px; line-height: 1; white-space: nowrap; }
  .weekday { font-size: 68px; line-height: 1; }
</style>
<main class="band" aria-label="Date and weekday watchface preview">
  <div class="date-view">
    <div class="date" id="date"></div>
    <div class="weekday" id="weekday"></div>
  </div>
</main>
<script>
  const date = document.querySelector('#date');
  const weekday = document.querySelector('#weekday');
  const weekdayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const params = new URLSearchParams(location.search);
  const rotation = params.get('rotation') === '270' ? 270 : 90;
  function render() {
    const now = new Date();
    date.textContent = `${now.getFullYear()}    ${String(now.getMonth() + 1).padStart(2, '0')}.${String(now.getDate()).padStart(2, '0')}`;
    weekday.textContent = weekdayNames[now.getDay()];
    weekday.style.color = now.getDay() === 0 ? '#FF3B30' : now.getDay() === 6 ? '#248BFF' : '#FFFFFF';
  }
  render();
  setInterval(render, 60 * 1000);
</script>
